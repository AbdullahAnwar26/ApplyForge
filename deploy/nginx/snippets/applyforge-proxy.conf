# ApplyForge reverse-proxy settings - include in every location that proxies to
# Gunicorn. (nginx drops inherited proxy_set_header directives as soon as a
# location defines any of its own, so they all live here.)
#
# Install: /etc/nginx/snippets/applyforge-proxy.conf

proxy_pass http://127.0.0.1:8000;   # Gunicorn, localhost only
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_redirect off;

proxy_set_header Host $host;
# Overwrite - never append to - anything the client sent. This connection is
# always HTTPS (this server block only listens with TLS), so the value is literal.
# Django trusts this header via SECURE_PROXY_SSL_HEADER=HTTP_X_FORWARDED_PROTO,https.
proxy_set_header X-Forwarded-Proto https;
# The direct peer only; $proxy_add_x_forwarded_for would keep a client-supplied chain.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
# Empty value = header removed. Django does not use these (USE_X_FORWARDED_HOST/
# USE_X_FORWARDED_PORT are off); strip them so nothing downstream can be misled.
proxy_set_header X-Forwarded-Host "";
proxy_set_header X-Forwarded-Port "";
proxy_set_header X-Forwarded-Server "";
proxy_set_header Forwarded "";
# Gunicorn also derives the scheme from these (its secure_scheme_headers, trusted from
# 127.0.0.1). A client-supplied value contradicting X-Forwarded-Proto would make
# Gunicorn reject the request with 400, so remove them too.
proxy_set_header X-Forwarded-Ssl "";
proxy_set_header X-Forwarded-Protocol "";

# Buffer the whole request body before Gunicorn sees it (slow uploads do not tie
# up a Gunicorn thread).
proxy_request_buffering on;
proxy_buffering on;

# Timeouts are NOT set here: the defaults (60s) are set at server level in
# applyforge.conf and the collector-run and generate locations override them with
# 900s (a directive repeated in the same context would be an nginx error).

# Django also sends these security headers; hide them so each response carries
# exactly one copy - the nginx version from applyforge-security-headers.conf.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;
proxy_hide_header X-Powered-By;
