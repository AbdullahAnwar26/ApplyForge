# ApplyForge security headers - include in the server block AND in every location
# that has its own add_header (nginx drops inherited add_header directives as soon
# as a location defines any of its own).
#
# Install: /etc/nginx/snippets/applyforge-security-headers.conf
#
# HSTS: one year, deliberately WITHOUT includeSubDomains and WITHOUT preload
# (both are hard to undo and could affect other hosts under the same domain).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# The SPA loads only its own bundled scripts and styles and calls only its own API.
# 'unsafe-inline' is limited to styles (component style attributes); scripts never.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
