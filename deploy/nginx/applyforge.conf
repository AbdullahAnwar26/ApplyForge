# ApplyForge - nginx site for a PRIVATE/VPN deployment (Milestone 8.4c).
#
# Install (see deploy/README.md):
#   /etc/nginx/sites-available/applyforge.conf   (this file; symlink it into sites-enabled)
#   /etc/nginx/snippets/applyforge-security-headers.conf
#   /etc/nginx/snippets/applyforge-proxy.conf
#
# Placeholders to replace before `nginx -t` (all are fictional examples):
#   10.99.0.1                 the server's address ON THE VPN interface (never a public address);
#                             used in `listen` and in `allow` (health checks from the server)
#   10.99.0.0/24              the VPN client subnet allowed to connect
#   applyforge.vpn.example    the private host name clients use (must match ALLOWED_HOSTS)
#   /etc/ssl/applyforge/...   certificate and key for that host name
#
# Layout:
#   /                         React SPA from /srv/applyforge/current/frontend/dist (client-side routes -> index.html)
#   /assets/                  hashed Vite bundles, cached for a year
#   /static/                  Django collectstatic output (/var/lib/applyforge/static)
#   /api/                     proxied to Gunicorn on 127.0.0.1:8000
#   /admin, /media            always 404 - never proxied, never served from disk
#
# Collector runs and draft generation are DISABLED on this server for now: their
# write methods get a 403 JSON answer here and never reach Django. The locations
# already carry the 900s timeouts needed once they are enabled (runbook section 10).

# Reject anything that does not name the ApplyForge host (e.g. requests by bare IP).
server {
    listen 10.99.0.1:443 ssl default_server;
    ssl_reject_handshake on;          # no certificate is presented for unknown names
}

server {
    listen 10.99.0.1:80 default_server;
    return 444;                       # close the connection without a response
}

# Plain HTTP on the VPN address: redirect to HTTPS on the fixed host name.
server {
    listen 10.99.0.1:80;
    server_name applyforge.vpn.example;

    allow 10.99.0.0/24;
    deny all;

    server_tokens off;
    return 301 https://applyforge.vpn.example$request_uri;
}

server {
    listen 10.99.0.1:443 ssl;
    server_name applyforge.vpn.example;

    # --- Access: VPN clients only -----------------------------------------
    # The server's own VPN address, so health checks through nginx from the server
    # itself work (runbook 8.1). Listed separately because with single-address VPN
    # setups (e.g. WireGuard /32 peers) it may lie outside the client subnet.
    allow 10.99.0.1;
    allow 10.99.0.0/24;
    deny all;

    server_tokens off;

    # --- TLS (terminated here) --------------------------------------------
    ssl_certificate     /etc/ssl/applyforge/applyforge.crt;
    ssl_certificate_key /etc/ssl/applyforge/applyforge.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:ApplyForgeTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- Logs -------------------------------------------------------------
    access_log /var/log/nginx/applyforge.access.log;
    error_log  /var/log/nginx/applyforge.error.log warn;

    # --- Limits and defaults ------------------------------------------------
    # Resume uploads are limited to 10 MB by the application; allow multipart overhead.
    client_max_body_size 12m;
    client_body_timeout 60s;

    # Default proxy timeouts for ordinary API calls (overridden below for the
    # two long-running endpoints).
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    root /srv/applyforge/current/frontend/dist;
    index index.html;
    charset utf-8;

    include /etc/nginx/snippets/applyforge-security-headers.conf;

    # --- Never served ---------------------------------------------------------
    # Django admin is blocked at the edge (the route still exists in Django).
    location ^~ /admin {
        return 404;
    }
    # Uploaded resumes are private. nginx never serves /media/ - not from disk and
    # not by proxying; nginx has no read access to /var/lib/applyforge/media either.
    location ^~ /media {
        return 404;
    }
    # Hidden files (.env, .git, ...) - none should exist under the web root.
    location ~ /\. {
        return 404;
    }

    # --- React SPA --------------------------------------------------------------
    location / {
        # Client-side routes (/jobs, /applications/12, ...) fall back to index.html.
        try_files $uri /index.html;
    }

    location = /index.html {
        # Always revalidate the entry point so a new release is picked up at once.
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/applyforge-security-headers.conf;
    }

    location ^~ /assets/ {
        # Content-hashed file names: safe to cache "forever". A missing asset is a
        # real 404, not the SPA page.
        try_files $uri =404;
        gzip on;
        gzip_types text/css application/javascript image/svg+xml;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/applyforge-security-headers.conf;
    }

    # --- Django static files (collectstatic) -------------------------------------
    location ^~ /static/ {
        alias /var/lib/applyforge/static/;
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/snippets/applyforge-security-headers.conf;
    }

    # --- API ------------------------------------------------------------------------
    location /api/ {
        include /etc/nginx/snippets/applyforge-proxy.conf;
    }

    # Collector (LinkedIn via Playwright): DISABLED on this server.
    # Reading run history (GET/HEAD) still works; starting a run (POST) and any other
    # method is refused here. The prefix covers every spelling nginx normalises to
    # this path (percent-encoding, duplicate slashes, dot segments).
    location ^~ /api/v1/collector/ {
        default_type application/json;
        if ($request_method !~ ^(GET|HEAD)$) {
            return 403 '{"detail":"Collection is disabled on this server."}';
        }
        include /etc/nginx/snippets/applyforge-proxy.conf;
        # A collector run is synchronous and can take minutes (Gunicorn timeout: 900s).
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Draft generation (local Ollama): DISABLED on this server.
    # [^/]+ rather than [0-9]+ so that no id spelling Django would accept slips past.
    location ~ ^/api/v1/applications/[^/]+/generate {
        default_type application/json;
        if ($request_method !~ ^(GET|HEAD)$) {
            return 403 '{"detail":"Draft generation is disabled on this server."}';
        }
        include /etc/nginx/snippets/applyforge-proxy.conf;
        # Generation is synchronous (Ollama timeout 180s by default); same ceiling as above.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
