# Drop-in: /etc/systemd/system/applyforge-backup.service.d/monitoring.conf (deploy/README.md 15.6).
# Success ping after a completed backup ("-": a monitoring outage must not mark the backup failed);
# any failure of the backup unit sends the /fail ping. A missing success ping = backup age alert.
[Unit]
OnFailure=applyforge-ping-fail@backup.service

[Service]
ExecStartPost=-/usr/local/sbin/applyforge-ping backup success
