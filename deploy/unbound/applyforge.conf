# /etc/unbound/unbound.conf.d/applyforge.conf - private resolver for VPN clients (deploy/README.md 15.1).
# Rehearsed in the two-server VM rehearsal (2026-11-21) with a fictional domain; not yet on real infrastructure.
# Answers ONLY on the VPN address and ONLY to the VPN subnet. The app hostname exists only here: public DNS
# must have NO address record for it. Other names are resolved recursively (outbound DNS is allowed).
# Replace <applyforge.example.org>.
server:
    interface: 10.99.0.1
    port: 53
    do-ip6: no
    access-control: 0.0.0.0/0 refuse
    access-control: 10.99.0.0/24 allow
    hide-identity: yes
    hide-version: yes
    local-zone: "<applyforge.example.org>." static
    local-data: "<applyforge.example.org>. 300 IN A 10.99.0.1"
