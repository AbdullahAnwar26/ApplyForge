# nginx drop-in: start nginx only after the VPN interface carries the address it listens on.
#
# Install: sudo install -d /etc/systemd/system/nginx.service.d
#          sudo install -m 0644 deploy/systemd/nginx-applyforge-vpn.conf \
#               /etc/systemd/system/nginx.service.d/applyforge-vpn.conf
#          sudo systemctl daemon-reload
# See deploy/README.md section 6.
#
# Why: deploy/nginx/applyforge.conf listens on the server's VPN address (10.99.0.1 in the examples).
# nginx and wg-quick are both ordered only after network-online.target, so at boot nginx can start
# first and fail with "bind() to 10.99.0.1:443 failed (99: Cannot assign requested address)". nginx
# does not restart on failure, so the site stays down until someone restarts it by hand. Found in the
# network rehearsal (QEMU/KVM VMs, Ubuntu 26.04, 2026-11-21).
#
# The unit name assumes wg-quick with interface wg0. For another VPN, name its unit instead.
[Unit]
Wants=wg-quick@wg0.service
After=wg-quick@wg0.service
